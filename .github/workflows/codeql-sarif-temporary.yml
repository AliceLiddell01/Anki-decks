name: Временный экспорт CodeQL SARIF

on:
  push:
    branches:
      - security/codeql-cleartext-logging-fix

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    name: CodeQL SARIF (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - rust
    steps:
      - name: Получить текущий снимок ветки
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Инициализировать CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Сформировать SARIF без загрузки в Code Scanning
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
          upload: never
          upload-database: false
          output: sarif-results

      - name: Сохранить SARIF как временный artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/${{ matrix.language }}.sarif
          if-no-files-found: error
          retention-days: 1
