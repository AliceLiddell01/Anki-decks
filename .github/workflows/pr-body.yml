name: Контракт описания PR
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read

jobs:
  pr-body:
    name: Структура PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Получить валидаторы и тесты
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Проверить тесты контрактов
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Проверить формат Agent Skills
        run: python3 .github/scripts/check_skill_contracts.py
      - name: Проверить реальное описание PR
        run: python3 .github/scripts/check_pr_body.py --event-path "$GITHUB_EVENT_PATH"
