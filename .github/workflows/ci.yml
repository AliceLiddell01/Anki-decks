name: Проверки репозитория

# Семантические triggers, без привязки к литералу имени ветки:
# - `pull_request` — проверка любого PR;
# - `push` — событие покрывает интеграцию в поддерживаемую ветку, а какой именно
#   branch является default, job определяет сам через `github.event.repository`
#   (см. `if` у job'ов), поэтому имя ветки в workflow не зашито;
# - `workflow_dispatch` — ручной запуск.
on:
  pull_request:
  push:
  workflow_dispatch:

# CI только читает репозиторий: ни один job не пишет в него, не публикует
# артефакты и не выполняет mutating repository операции.
permissions:
  contents: read

concurrency:
  # Новый прогон отменяет предыдущий только для PR: проверку default branch
  # нельзя отменять на середине.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  code:
    name: Код и тесты
    # Push в feature-ветку не дублирует прогон PR: на push job выполняется
    # только для default branch текущего репозитория.
    if: >-
      github.event_name != 'push'
      || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Установить стабильный Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - name: Проверить форматирование
        run: cargo fmt --all --check

      - name: Проверить статику Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Собрать и выполнить тесты
        run: cargo test --workspace --all-features --locked

      - name: Проверить verified-only kanji corpus
        # Ветка без tracked corpus допустима. Если store присутствует (в том числе
        # как symlink), read-only gate обязан подтвердить verified-only содержимое.
        run: |
          if [ -e .asset-store/kanji ] || [ -L .asset-store/kanji ]; then
            cargo run --quiet --locked --bin kanji-corpus-gate
          else
            echo "Канонический kanji corpus отсутствует; проверка пропущена"
          fi

      - name: Проверить корпус pitch-accent на записи только со статусом VERIFIED
        # Отсутствующий каталог допустим. Если хранилище присутствует (в том числе
        # как символическая ссылка), проверка только для чтения подтверждает, что
        # все записи корпуса прошли обязательную автоматическую проверку.
        run: |
          if [ -e .asset-store/pitch-accent ] || [ -L .asset-store/pitch-accent ]; then
            cargo run --quiet --locked --bin pitch-corpus-gate
          else
            echo "Канонический корпус pitch-accent отсутствует; проверка пропущена"
          fi

      - name: Проверить найденные CrowdAnki-экспорты
        # Шаг сам находит экспорты внутри `decks/` и ничего не знает о конкретных
        # колодах, уровнях, моделях заметок и именах полей. Отсутствие экспортов —
        # не ошибка, поэтому состав данных может меняться без правки CI. Но каждый
        # фактически найденный экспорт обязан проходить `validate`: структурно
        # невалидный закоммиченный payload делает шаг красным.
        run: |
          set -euo pipefail
          status=0
          found=0
          # Отсутствие `decks/` — допустимое состояние, а не ошибка шага.
          if [ -d decks ]; then
            # Список собирается в файл: ошибка обхода не должна теряться внутри
            # process substitution, иначе часть экспортов молча выпадет из
            # проверки, а шаг останется зелёным. Поэтому обход идёт отдельной
            # командой под `set -e`, а его диагностика не подавляется.
            deck_list=$(mktemp)
            trap 'rm -f "$deck_list"' EXIT
            find decks -name deck.json -print0 > "$deck_list"
            while IFS= read -r -d '' deck_json; do
              found=$((found + 1))
              export_dir=$(dirname "$deck_json")
              echo "Проверяю экспорт: $export_dir"
              cargo run --quiet --locked --bin anki-repo -- validate "$export_dir" || status=1
            done < "$deck_list"
          fi
          echo "Найдено экспортов: $found"
          exit "$status"

  msrv:
    name: Заявленная MSRV
    if: >-
      github.event_name != 'push'
      || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Прочитать заявленную MSRV
        id: msrv
        # Единственный владелец значения — `[workspace.package] rust-version`
        # в корневом Cargo.toml. Workflow не хранит собственную копию версии:
        # он спрашивает Cargo и заодно проверяет, что участники workspace не
        # расходятся в `rust-version`.
        run: |
          set -euo pipefail
          versions=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].rust_version] | unique | .[]')
          declared=$(printf '%s\n' "$versions" | grep -c . || true)
          if [ "$declared" -ne 1 ]; then
            echo "::error::участники workspace расходятся в rust-version: $(printf '%s' "$versions" | tr '\n' ' ')"
            exit 1
          fi
          echo "toolchain=$versions" >> "$GITHUB_OUTPUT"
          echo "Заявленная MSRV: $versions"

      - name: Установить Rust заявленной MSRV
        run: rustup toolchain install "${{ steps.msrv.outputs.toolchain }}" --profile minimal

      - name: Проверить сборку на заявленной MSRV
        run: cargo +${{ steps.msrv.outputs.toolchain }} check --workspace --all-targets --all-features --locked
