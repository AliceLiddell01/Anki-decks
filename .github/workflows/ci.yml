name: Проверки репозитория

# Семантические события запуска без привязки к имени ветки:
# - `pull_request` — проверка любого PR;
# - `push` — событие покрывает интеграцию в поддерживаемую ветку, а какой именно
#   ветка является основной, задание определяет через `github.event.repository`
#   (см. `if` у заданий), поэтому имя ветки в процессе не зашито;
# - `workflow_dispatch` — ручной запуск.
on:
  pull_request:
  push:
  workflow_dispatch:

# CI только читает репозиторий: ни одно задание не пишет в него, не публикует
# артефакты и не выполняет изменяющих операций с репозиторием.
permissions:
  contents: read

concurrency:
  # Новый прогон отменяет предыдущий только для PR: проверку основной ветки
  # нельзя отменять на середине.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Форматирование и Clippy
    # Отправка изменений в рабочую ветку не дублирует прогон PR: на `push` задание выполняется
    # только для основной ветки текущего репозитория.
    if: >-
      github.event_name != 'push'
      || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Проверить контракты скриптов и метаданные Agent Skills
        # Единственный владелец этих проверок: они не зависят от данных репозитория
        # и нужны также при отправке изменений в основную ветку, где события PR нет.
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python3 .github/scripts/check_skill_contracts.py

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Проверить контракт MSRV, rustup и компилятора
        run: python3 .github/scripts/check_rust_toolchain.py

      - name: Восстановить кэш Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Проверить форматирование
        run: cargo fmt --all --check

      - name: Проверить статику Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  code:
    name: Код и тесты
    env:
      # sccache сохраняет результаты rustc библиотечных пакетов рабочей области между
      # исполнителями GitHub Actions; rust-cache ниже кэширует реестр и сборку Cargo.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    # Отправка изменений в рабочую ветку не дублирует прогон PR: при `push` задание выполняется
    # только для основной ветки текущего репозитория.
    if: >-
      github.event_name != 'push'
      || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Проверить контракт MSRV, rustup и компилятора
        run: python3 .github/scripts/check_rust_toolchain.py

      - name: Настроить sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Восстановить кэш Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Всё задание использует один специализированный профиль (тесты и `cargo run`),
          # поэтому используем отдельное поколение кэша зависимостей.
          key: unified-ci-v1

      - name: Собрать и выполнить тесты
        # В рабочей области нет тестов, ограниченных возможностями Cargo. Единственная возможность
        # `reference-generator` включает resvg только для двух служебных
        # исполняемых файлов генератора; сборку всех целей и возможностей уже проверяют
        # задания Clippy и MSRV параллельно.
        run: cargo test --workspace --locked --profile ci

      - name: Проверить подтверждённые записи корпуса кандзи
        # Ветка без отслеживаемого корпуса допустима. Если хранилище присутствует
        # (в том числе как символическая ссылка), проверка только для чтения
        # обязана подтвердить, что все записи корпуса проверены.
        run: |
          if [ -e .asset-store/kanji ] || [ -L .asset-store/kanji ]; then
            cargo run --quiet --locked --profile ci --bin kanji-corpus-gate
          else
            echo "Канонический корпус кандзи отсутствует; проверка пропущена"
          fi

      - name: Проверить корпус pitch-accent на записи только со статусом VERIFIED
        # Отсутствующий каталог допустим. Если хранилище присутствует (в том числе
        # как символическая ссылка), проверка только для чтения подтверждает, что
        # все записи корпуса прошли обязательную автоматическую проверку.
        run: |
          if [ -e .asset-store/pitch-accent ] || [ -L .asset-store/pitch-accent ]; then
            cargo run --quiet --locked --profile ci --bin pitch-corpus-gate
          else
            echo "Канонический корпус pitch-accent отсутствует; проверка пропущена"
          fi

      - name: Проверить найденные CrowdAnki-экспорты
        # Шаг сам находит экспорты внутри `decks/` и ничего не знает о конкретных
        # колодах, уровнях, моделях заметок и именах полей. Отсутствие экспортов —
        # не ошибка, поэтому состав данных может меняться без правки CI. Но каждый
        # фактически найденный экспорт обязан проходить `validate`: структурно
        # невалидное содержимое коммита делает шаг красным.
        run: |
          set -euo pipefail
          status=0
          found=0
          # Отсутствие `decks/` — допустимое состояние, а не ошибка шага.
          if [ -d decks ]; then
            # Список собирается в файл: ошибка обхода не должна теряться внутри
            # process substitution, иначе часть экспортов молча выпадет из
            # проверки, а шаг останется зелёным. Поэтому обход идёт отдельной
            # командой под `set -e`, а его диагностика не подавляется.
            deck_list=$(mktemp)
            trap 'rm -f "$deck_list"' EXIT
            find decks -name deck.json -print0 > "$deck_list"
            while IFS= read -r -d '' deck_json; do
              found=$((found + 1))
              export_dir=$(dirname "$deck_json")
              echo "Проверяю экспорт: $export_dir"
              cargo run --quiet --locked --profile ci --bin anki-repo -- validate "$export_dir" || status=1
            done < "$deck_list"
          fi
          echo "Найдено экспортов: $found"
          exit "$status"

      - name: Показать статистику sccache
        if: always()
        run: sccache --show-stats

  msrv:
    name: Заявленная MSRV
    if: >-
      github.event_name != 'push'
      || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Установить Rust из rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Проверить контракт MSRV, rustup и компилятора
        run: python3 .github/scripts/check_rust_toolchain.py

      - name: Восстановить кэш Rust для MSRV
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv

      - name: Проверить сборку на заявленной MSRV
        run: cargo check --workspace --all-targets --all-features --locked
