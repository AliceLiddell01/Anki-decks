[package]
name = "anki-repo"
version = "0.1.0"
edition = "2024"
description = "Read-only CLI для детерминированного анализа CrowdAnki-экспортов репозитория Anki-decks"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lib]
name = "anki_repo"
path = "src/lib.rs"

[[bin]]
name = "anki-repo"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
