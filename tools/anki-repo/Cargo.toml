[package]
name = "anki-repo"
version = "0.1.0"
# `edition` и `rust-version` принадлежат корневому workspace (`/Cargo.toml`,
# `[workspace.package]`): toolchain/MSRV объявлены там один раз для всех
# Rust-участников репозитория, а CI читает их оттуда же.
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI для детерминированного анализа CrowdAnki-экспортов репозитория Anki-decks и точечной правки значений их полей"
publish = false
autotests = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
getrandom = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
asset-store = { path = "../asset-store" }
serde_yaml = { package = "yaml_serde", version = "0.10" }
sha2 = "0.10"
rustix = { version = "1.1", features = ["fs"] }
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# Межпроцессная сериализация публикации `deck.json`. Публичный API этого crate
# под `unsafe_code = "forbid"`, поэтому блокировка берётся не через ручной FFI,
# а через небольшую обёртку над `flock(2)`. На Linux зависимость сводится к
# `libc`; `File::lock`/`try_lock` из std появились только в Rust 1.89, а
# заявленная в корневом workspace MSRV ниже этой версии.
[target.'cfg(unix)'.dependencies]
fs2 = "0.4"

[lib]
name = "anki_repo"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "anki-repo"
test = false
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
