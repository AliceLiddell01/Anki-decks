[package]
name = "review-observatory"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Явно запускаемое локальное наблюдение артефактов независимого ревью"

[dependencies]
anki-repo = { path = "../anki-repo" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
async-stream = "0.3"
futures-core = "0.3"
fs2 = "0.4"
rustix = { version = "1.1", features = ["fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
