[package]
name = "asset-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Переиспользуемый lifecycle store для программно принадлежащих assets"
publish = false

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
chromiumoxide = "0.9.1"
futures = "0.3"
flate2 = "1.1"
image = { version = "0.25.10", default-features = false, features = ["gif", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
rustix = { version = "1.1", features = ["fs"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
url = "2"
resvg = { version = "0.48.0", default-features = false, features = ["text"], optional = true }

[features]
reference-generator = ["dep:resvg"]

[lib]
name = "asset_store"
path = "src/lib.rs"

[[bin]]
name = "kanji-assets"
path = "src/main.rs"

[[bin]]
name = "kanji-corpus-gate"
path = "src/bin/kanji_corpus_gate.rs"

[[bin]]
name = "build-kanjivg-reference"
path = "src/bin/build_kanjivg_reference.rs"
required-features = ["reference-generator"]

[[bin]]
name = "build-yarxi-font-reference"
path = "src/bin/build_yarxi_font_reference.rs"
required-features = ["reference-generator"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
