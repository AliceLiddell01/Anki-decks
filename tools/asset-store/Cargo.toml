[package]
name = "asset-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Переиспользуемый lifecycle store для программно принадлежащих assets"
publish = false

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
chromiumoxide = "0.9.1"
futures = "0.3"
flate2 = "1.1"
image = { version = "0.25.10", default-features = false, features = ["gif", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
rustix = { version = "1.1", features = ["fs"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "signal"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "json"] }
url = "2"
resvg = { version = "0.47.0", default-features = false, features = ["text"], optional = true }
zip = { version = "2.4.2", default-features = false }

[features]
reference-generator = ["dep:resvg"]

[lib]
name = "asset_store"
path = "src/lib.rs"

[[bin]]
name = "kanji-assets"
test = false
path = "src/main.rs"

[[bin]]
name = "kanji-corpus-gate"
test = false
path = "src/bin/kanji_corpus_gate.rs"

[[bin]]
name = "pitch-corpus-gate"
test = false
path = "src/bin/pitch_corpus_gate.rs"

[[bin]]
name = "pitch-assets"
test = false
path = "src/bin/pitch_assets.rs"

[[bin]]
name = "build-kanjivg-reference"
path = "src/bin/build_kanjivg_reference.rs"
required-features = ["reference-generator"]

[[bin]]
name = "build-yarxi-font-reference"
path = "src/bin/build_yarxi_font_reference.rs"
required-features = ["reference-generator"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
