# Корневой Cargo workspace — каноническая точка запуска Rust-проверок
# репозитория. Из него `cargo` видит toolkit `tools/anki-repo`, поэтому CI и
# локальные проверки не обязаны знать фактический layout crate'а, а версия
# toolchain и edition объявлены здесь один раз для всех участников workspace.
#
# Это не отдельный crate: корень остаётся репозиторием колод, а Cargo — его
# repository-level границей для Rust-кода.
[workspace]
members = ["tools/anki-repo", "tools/asset-store", "tools/repository-maintenance"]
resolver = "3"

[workspace.package]
# Минимальная поддерживаемая версия Rust (MSRV) для всех участников workspace.
# Единственный владелец этого значения: CI читает его отсюда через
# `cargo metadata`, а не хранит собственную копию.
rust-version = "1.88"
edition = "2024"
license = "MIT"

# CI и локальный cargo test не требуют полноценных DWARF-символов. При этом
# test-профиль по-прежнему наследует debug-assertions=true и overflow-checks=true
# от dev, поэтому диагностические проверки поведения не ослабляются.
[profile.test]
debug = 0

# asset-store содержит CPU-тяжёлые проверки растровых эталонов кандзи.
# Умеренная оптимизация test-profile сокращает время этих проверок, не
# переводя весь workspace на более дорогую release-подобную компиляцию.
[profile.test.package.asset-store]
opt-level = 1

# Hosted CI использует один профиль и для test harness, и для последующих
# repository-level CLI gates. Это позволяет переиспользовать codegen зависимостей
# вместо перехода из test-профиля обратно в dev при каждом cargo run.
[profile.ci]
inherits = "dev"
debug = 0

[profile.ci.package.asset-store]
opt-level = 1
